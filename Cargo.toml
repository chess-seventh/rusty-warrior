[package]
name = "rusty-warrior"
version = "0.2.0"
authors = ["chess7th"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
notify-rust = "4.11.0"
config = "0.14.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
